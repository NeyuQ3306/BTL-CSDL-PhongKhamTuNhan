{% macro password_field(id, required=False, minlength=None, maxlength=36, autocomplete='new-password') -%}
<div class="password-field" data-password-field>
  <input id="{{ id }}" name="password" type="password" autocomplete="{{ autocomplete }}" maxlength="{{ maxlength }}"{% if minlength is not none %} minlength="{{ minlength }}"{% endif %}{% if required %} required{% endif %}>
  <button type="button" class="password-toggle" aria-controls="{{ id }}" aria-label="Hiện mật khẩu" aria-pressed="false" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    <span data-password-label>Hiện</span>
  </button>
</div>
{%- endmacro %}
