name: Report UI images
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/capture_report_images.py'
      - '.github/workflows/report-images.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: clinic_report_images_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: disposable-ci-password
      DB_NAME: clinic_report_images_test
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt "playwright>=1.50,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m tools.capture_report_images
      - uses: actions/upload-artifact@v4
        with:
          name: report-ui-images
          path: test-artifacts/report-images/
          if-no-files-found: error
          retention-days: 14
