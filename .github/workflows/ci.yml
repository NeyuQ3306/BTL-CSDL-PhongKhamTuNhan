name: Backend and MySQL
on:
  push:
    branches: [main, trung/week-1, trung/week-2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: clinic_week1_test
          MYSQL_USER: clinic_test
          MYSQL_PASSWORD: disposable-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: disposable-ci-password
      DB_NAME: clinic_week1_test
      FLASK_SECRET_KEY: disposable-ci-session-key
      RUN_MYSQL_TESTS: '1'
      RUN_BROWSER_TESTS: '1'
      QUYEN_CHECK_WEEK2: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py clinic_app tools tests
      - name: Parse all templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          for root in ['templates', 'clinic_app/templates']:
              for path in Path(root).rglob('*.html'):
                  Environment().parse(path.read_text(encoding='utf-8'))
          PY
      - run: python -m pip install "playwright>=1.50,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m tools.quyen_week1_evidence --install
      - run: python -m pytest -v --junitxml=test-artifacts/week2/pytest.xml
      - run: python -m tools.quyen_week1_evidence
      - run: python -m tools.audit_seed
      - name: Week 1 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week1-browser-${{ github.run_id }}
          path: test-artifacts/week1/
          if-no-files-found: warn
          retention-days: 30
      - name: Week 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week2-integration-${{ github.run_id }}
          path: test-artifacts/
          retention-days: 30
