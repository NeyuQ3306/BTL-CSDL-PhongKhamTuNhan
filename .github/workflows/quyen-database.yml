name: Quyen database MySQL 8.4
on:
  push:
    branches: [quyen/week-1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: clinic_quyen_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: disposable-ci-password
      DB_NAME: clinic_quyen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.quyen_db
      - run: python -m pytest tests/test_quyen_database.py -v
  backend-compatibility:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: clinic_compat_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: disposable-ci-password
      DB_NAME: clinic_compat_test
      FLASK_SECRET_KEY: disposable-ci-session-key
      RUN_MYSQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          ref: 9e912fa808a93f54129dc730d72738772e01c492
          path: compatibility
      - run: python -m pip install -r requirements-dev.txt
      - name: Import the pinned pre-rename cmt database
        working-directory: compatibility
        run: python -m tools.quyen_db
      - name: Verify the pre-rename backend before upgrading
        working-directory: compatibility
        run: python -m pytest tests/test_backend.py tests/test_week2.py -v
      - name: Migrate the same populated database to cccd
        run: python -m tools.migrate_cccd --apply
      - name: Verify the new backend, constraints and resumable migration
        run: python -m pytest tests/test_backend.py tests/test_week2.py tests/test_cccd_migration.py -v
