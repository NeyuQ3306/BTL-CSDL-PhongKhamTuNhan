name: Quyen analytics MySQL 8.4
on:
  pull_request:
    branches: [main]
    paths:
      - 'database/**'
      - 'tools/analytics_*.py'
      - 'tests/test_quyen_analytics.py'
      - '.github/workflows/quyen-analytics.yml'
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: clinic_analytics_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: disposable-ci-password
      DB_NAME: clinic_analytics_test
      RUN_MYSQL_TESTS: '1'
      QUYEN_CHECK_WEEK2: '1'
      FLASK_SECRET_KEY: disposable-ci-session-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.quyen_db
      - name: Analytics and required query regressions
        run: python -m pytest tests/test_quyen_analytics.py tests/test_quyen_database.py tests/test_quyen_week2_reports.py -v --junitxml=test-artifacts/analytics/pytest.xml
      - name: Independent oracle and unchanged seed
        run: python -m tools.analytics_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quyen-analytics-${{ github.run_id }}
          path: test-artifacts/analytics/
          retention-days: 30
