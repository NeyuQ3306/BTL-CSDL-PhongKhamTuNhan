name: Trung week 3 preparation
on:
  pull_request:
    branches: [main]
    paths: ['week3_checks/**', 'tools/trung_week3_preflight.py', 'docs/TRUNG_WEEK3*', '.github/workflows/trung-week3.yml']
permissions:
  contents: read
jobs:
  backend-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trung-week2
            sha: da59e561b187ee693842efd4c6e943c64201a4a1
          - name: vuong-week2
            sha: e346a9f39b6e4fa932cd689dea85c95008cb1687
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: clinic_week3_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: disposable-ci-password
      DB_NAME: clinic_week3_test
      FLASK_SECRET_KEY: disposable-week3-key
      RUN_MYSQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r candidate/requirements-dev.txt
      - name: Add only week-3 checks to pinned candidate
        run: |
          cp -r week3_checks candidate/
          cp tools/trung_week3_preflight.py candidate/tools/
      - name: Canonical import with audit
        working-directory: candidate
        run: python -m tools.quyen_week1_evidence --install
      - name: Before checks
        working-directory: candidate
        run: python -m tools.trung_week3_preflight --expected-sha ${{ matrix.sha }} --output test-artifacts/week3/before.json
      - name: NULL, money, not-found and rollback
        working-directory: candidate
        run: python -m pytest week3_checks -v --junitxml=test-artifacts/week3/pytest.xml
      - name: Audit after cleanup
        if: always()
        working-directory: candidate
        run: python -m tools.trung_week3_preflight --expected-sha ${{ matrix.sha }} --output test-artifacts/week3/after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trung-week3-${{ matrix.name }}
          path: candidate/test-artifacts/
          retention-days: 30
