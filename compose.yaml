services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Fill MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: clinic_project1
      MYSQL_USER: clinic_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Fill MYSQL_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - clinic_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  clinic_mysql:
